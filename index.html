<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./scripts/script.js" defer></script>
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Tic-Tac-Toe</title>
  </head>

  <body>
    <div class="container">
      <div class="title">TIC-TAC-TOE</div>
      <div class="start-game-wrapper">
        <form id="start-game-form" class="start-game-form">
          <div class="start-game-player-one">
            <label for="playerOneInput">Player 1</label>
            <input
              id="playerOneInput"
              class="player-one-input"
              maxlength="25"
            />
          </div>
          <div class="start-game-player-two">
            <label for="playerTwoInput">Player 2</label>
            <input
              id="playerTwoInput"
              class="player-two-input"
              maxlength="25"
            />
          </div>
        </form>
        <button type="button" form="start-game-form" class="start-btn">
          Start Game
        </button>
      </div>
      <div class="main-game-wrapper">
        <div class="player-names">
          <div class="player-one-wrapper">
            <div id="playerOne" class="player-one">Player One</div>
          </div>
          <div class="player-two-wrapper">
            <div id="playerTwo" class="player-two">Player Two</div>
          </div>
        </div>
        <div class="players-turn"></div>
        <button type="button" class="restart-btn">Restart Game</button>
        <div class="board"></div>
      </div>
    </div>
  </body>
</html>
