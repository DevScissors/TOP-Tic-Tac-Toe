<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="./scripts/script.js" defer></script>
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Tic-Tac-Toe</title>
  </head>

  <body>
    <div class="container">
      <div class="player-names">
        <div class="player-one-wrapper">
          <div id="playerOne" class="player-one">Player One</div>
          <img src="./images/edit.svg" class="player-one-edit" height="20px" />
        </div>
        <div class="player-two-wrapper">
          <div id="playerTwo" class="player-two">Player Two</div>
          <img src="./images/edit.svg" class="player-two-edit" height="20px" />
        </div>
      </div>
      <div class="players-turn"></div>
      <div class="board"></div>
      <div class="results"></div>
    </div>
  </body>
</html>
